name: Patched nightly desktop builds

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:

concurrency:
  group: patched-nightly-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Prepare latest upstream nightly
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      source_tag: ${{ steps.prepare.outputs.source_tag }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Check out fork main
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PATCHED_NIGHTLY_RELEASE_TOKEN }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: prepare
        name: Resolve upstream source and prepare draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
          PATCH_BASE: v0.1.2-nightly.20261022.3526
          PATCH_BASE_SHA: f054d1b8018721bd997d99cbb918a7b17bf098a4
        run: |
          set -euo pipefail

          source_tag="$(gh api repos/pingdotgg/t3code/releases?per_page=100 \
            --jq '[.[] | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}\\.[0-9]+$"))] | sort_by(.published_at) | last | .tag_name')"
          if [[ -z "$source_tag" || "$source_tag" == "null" ]]; then
            echo "No upstream nightly release was found." >&2
            exit 1
          fi

          # The environment filter and NAS update target are ported below because their old commits conflict upstream.
          patch_commits="$(git log --reverse --format='%H' --grep='^patch:' "$PATCH_BASE_SHA..$WORKFLOW_SHA" \
            | awk '$0 != "6611d52bdf24eb30ae3708f8fc7718334d1892d5" && $0 != "31a1311b2017ccb5e1b9a86735699b766069fa48"')"
          if [[ -z "$patch_commits" ]]; then
            echo "No patch commits were found after $PATCH_BASE." >&2
            exit 1
          fi
          compatibility_patch="$RUNNER_TEMP/portable-nightly-fixes.patch"
          git show "$WORKFLOW_SHA:.github/patches/portable-nightly-fixes.patch" > "$compatibility_patch"
          compatibility_patch_sha="$(sha256sum "$compatibility_patch" | cut -d' ' -f1)"
          patch_set="$( { printf '%s\n' "$patch_commits"; printf '%s\n' "$compatibility_patch_sha"; } \
            | sha256sum | cut -c1-16)"

          releases="$(gh api "repos/$FORK_REPOSITORY/releases?per_page=100")"
          prior="$(jq -r --arg source "Source nightly: $source_tag" --arg patch_set "Patch set: $patch_set" \
            '[.[] | select(((.body // "") | contains($source)) and ((.body // "") | contains($patch_set)))] | first // empty' <<<"$releases")"
          if [[ -n "$prior" ]]; then
            release_tag="$(jq -r '.tag_name' <<<"$prior")"
            draft="$(jq -r '.draft' <<<"$prior")"
            if [[ "$draft" != "true" ]]; then
              echo "Upstream nightly $source_tag with patch set $patch_set is already published as $release_tag; no build needed."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="${release_tag#v}"
          else
            source_version="${source_tag#v}"
            if [[ ! "$source_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-nightly\.([0-9]{8})\.([0-9]+)$ ]]; then
              echo "Unexpected upstream nightly version: $source_tag" >&2
              exit 1
            fi
            product_version="${BASH_REMATCH[1]}"
            nightly_date="${BASH_REMATCH[2]}"
            source_number="${BASH_REMATCH[3]}"
            prefix="v${product_version}-nightly.${nightly_date}."
            fork_max="$(jq -r --arg prefix "$prefix" \
              '[.[] | .tag_name | select(startswith($prefix)) | ltrimstr($prefix) | select(test("^[0-9]+$")) | tonumber] | max // 0' \
              <<<"$releases")"
            for existing_tag in $(git tag -l "${prefix}*"); do
              tag_number="${existing_tag#"$prefix"}"
              if [[ "$tag_number" =~ ^[0-9]+$ ]] && (( tag_number > fork_max )); then
                fork_max="$tag_number"
              fi
            done
            next_number=$((source_number + 1))
            if (( fork_max >= next_number )); then next_number=$((fork_max + 1)); fi
            version="${product_version}-nightly.${nightly_date}.${next_number}"
            release_tag="v$version"
          fi

          printf 'should_build=true\nsource_tag=%s\nrelease_tag=%s\nversion=%s\n' \
            "$source_tag" "$release_tag" "$version" >> "$GITHUB_OUTPUT"
          if [[ -n "$prior" ]]; then
            echo "Reusing incomplete draft release $release_tag for $source_tag."
            exit 0
          fi

          git fetch --no-tags https://github.com/pingdotgg/t3code.git "$source_tag"
          source_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$PATCH_BASE_SHA" "$source_sha"; then
            echo "Upstream nightly $source_tag does not contain the patch base $PATCH_BASE; refusing to apply patches to an older source." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$source_sha"
          while IFS= read -r patch_commit; do
            [[ -z "$patch_commit" ]] && continue
            git cherry-pick "$patch_commit"
          done <<<"$patch_commits"
          git apply --check "$compatibility_patch"
          git apply "$compatibility_patch"
          git add -u
          git commit -m "patch: apply portable fork fixes to upstream nightly"

          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            existing_sha="$(git rev-parse "$release_tag^{commit}")"
            if [[ "$existing_sha" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag $release_tag already points at a different source commit." >&2
              exit 1
            fi
          else
            git tag "$release_tag"
            git push origin "refs/tags/$release_tag"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Patched T3 Code nightly.

          Source nightly: $source_tag
          Source commit: $source_sha
          Patch set: $patch_set

          Includes these fork fixes:
          - Order active threads by the latest message or run activity.
          - Hide threads from disconnected environments and restore them on reconnect.
          - Target NAS server updates at the source upstream nightly.
          - Render Codex memory citations as readable references.
          - Keep worktrees when Git reports a broken worktree pointer.

          The macOS installer is signed and notarized. The Windows installer is unsigned.
          EOF
          if ! gh release view "$release_tag" --repo "$FORK_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" --repo "$FORK_REPOSITORY" \
              --title "T3 Code Nightly $version (Patched)" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft --prerelease
          fi

  windows:
    name: Build Windows installer
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      BUILD_VERSION: ${{ needs.resolve.outputs.version }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out fork workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check out prepared patched nightly source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_TAG"
          git checkout --detach 'FETCH_HEAD^{commit}'

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Load official upstream T3 Connect settings
        shell: bash
        run: cp .env.example .env

      - name: Build patched Windows installer
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_SERVER_UPDATE_VERSION: ${{ needs.resolve.outputs.source_tag }}
        run: |
          set -euo pipefail
          export T3CODE_SERVER_UPDATE_VERSION="${T3CODE_SERVER_UPDATE_VERSION#v}"
          node scripts/build-desktop-artifact.ts \
            --platform win --target nsis --arch x64 \
            --build-version "$BUILD_VERSION" \
            --output-dir release-patched
          gh release upload "$RELEASE_TAG" release-patched/* \
            --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    name: Build macOS installers
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      BUILD_VERSION: ${{ needs.resolve.outputs.version }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out fork workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check out prepared patched nightly source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_TAG"
          git checkout --detach 'FETCH_HEAD^{commit}'

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Load official upstream T3 Connect settings
        shell: bash
        run: cp .env.example .env

      - name: Build patched macOS installer
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_SERVER_UPDATE_VERSION: ${{ needs.resolve.outputs.source_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" ]]; then
            echo "Missing Developer ID signing secrets; refusing to build an unsigned macOS updater." >&2
            exit 1
          fi
          if [[ -z "${APPLE_API_KEY:-}" || -z "${APPLE_API_KEY_ID:-}" || -z "${APPLE_API_ISSUER:-}" ]]; then
            echo "Missing App Store Connect notarization secrets; refusing to publish an unnotarized macOS build." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          chmod 600 "$key_path"
          export APPLE_API_KEY="$key_path"
          export T3CODE_SERVER_UPDATE_VERSION="${T3CODE_SERVER_UPDATE_VERSION#v}"
          node scripts/build-desktop-artifact.ts \
            --platform mac --target dmg --arch "${{ matrix.arch }}" \
            --signed \
            --build-version "$BUILD_VERSION" \
            --output-dir "release-patched-${{ matrix.arch }}"
          gh release upload "$RELEASE_TAG" "release-patched-${{ matrix.arch }}"/* \
            --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish completed nightly
    needs: [resolve, windows, macos]
    if: ${{ always() && needs.resolve.outputs.should_build == 'true' && needs.windows.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          releases="$(gh api "repos/$FORK_REPOSITORY/releases?per_page=100")"
          release_id="$(jq -r --arg tag "$RELEASE_TAG" \
            '[.[] | select(.tag_name == $tag)] | first | .id // empty' <<<"$releases")"
          if [[ -z "$release_id" || "$release_id" == "null" ]]; then
            echo "Draft release $RELEASE_TAG was not found." >&2
            exit 1
          fi
          gh api --method PATCH "repos/$FORK_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease=true >/dev/null
