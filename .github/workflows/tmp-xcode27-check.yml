name: tmp xcode27 check
on:
  push:
    branches: [t3/testflight-ios27-sdk-build]
jobs:
  check:
    runs-on: xcode-27
    steps:
      - run: |
          xcode="$(/bin/ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n1)"
          [ -n "$xcode" ] || { echo "No Xcode 27" >&2; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -showsdks | grep -q 'iphoneos27' || { echo "iOS 27 SDK missing" >&2; exit 1; }
